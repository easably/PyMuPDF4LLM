name: Container

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python scripts/fetch_tessdata.py
        env:
          TESSDATA_PREFIX: ${{ github.workspace }}/tessdata
      - run: pytest
        env:
          TESSDATA_PREFIX: ${{ github.workspace }}/tessdata

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: |
            pymupdf4llm:ci
            ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pymupdf==1.28.2 httpx==0.28.1
      - name: HTTP smoke
        run: |
          docker run -d --name pymupdf4llm-smoke -p 8080:8080 pymupdf4llm:ci
          docker cp scripts pymupdf4llm-smoke:/tmp/scripts
          docker exec -e TESSDATA_PREFIX=/usr/share/tessdata pymupdf4llm-smoke python /tmp/scripts/fetch_tessdata.py --check
          python scripts/smoke_http.py http://127.0.0.1:8080
      - name: Remove smoke container
        if: always()
        run: docker rm -f pymupdf4llm-smoke
      - name: Push image
        if: github.event_name == 'push'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            docker push "$tag"
          done <<< "$TAGS"
